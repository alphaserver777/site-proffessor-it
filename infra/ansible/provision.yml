---
- name: Provision Professor IT marketing web host
  hosts: marketing_web
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: "The production playbook expects Ubuntu 24.04 LTS or newer"

  roles:
    - role: base
    - role: marketing_site

